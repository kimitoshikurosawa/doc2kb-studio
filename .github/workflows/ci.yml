name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 = Maintenance LTS, 24 = Active LTS (production target), 26 = Current
        node-version: [ 22.x, 24.x, 26.x ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Audit production dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: Run Test Suite
      run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Build image
      run: docker build -t doc2kb-studio:ci .

    - name: Smoke test container
      run: |
        docker run -d --name doc2kb -p 3000:3000 doc2kb-studio:ci
        for i in $(seq 1 20); do curl -fsS http://localhost:3000/api/status && exit 0; sleep 1; done
        docker logs doc2kb
        exit 1
